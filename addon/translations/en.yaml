configuration:
  log_level:
    name: Log level
    description: Verbosity of the Cosmos server logs. `trace`/`debug` enable verbose Node logging.
  log_musicvideo:
    name: Video backdrop tracing
    description: >-
      Log which YouTube candidates the video backdrop widget considered, how each
      scored, and why nothing plays when nothing does. Errors are always logged;
      this adds the detail. Leave off for normal use.
network:
  8099/tcp: Web UI port (kiosk + admin).
